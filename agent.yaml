tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - research
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/hallucination-grounding-checker"
