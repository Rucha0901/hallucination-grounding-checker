spec_version: "0.1.0"
name: hallucination-grounding-checker
version: 1.0.0
description: Verifies that generated model claims are strictly entailment-grounded in trusted external retrieval contexts without extrapolation.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
